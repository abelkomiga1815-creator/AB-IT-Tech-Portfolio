# Reference reverse-proxy configuration for a single-server production deployment.
# Replace example.com, certificate paths and upstream ports. TLS certificates are not included.

upstream portfolio_frontend { server 127.0.0.1:3000; }
upstream portfolio_backend  { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name portfolio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portfolio.example.com;

    ssl_certificate     /etc/letsencrypt/live/portfolio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.example.com/privkey.pem;

    client_max_body_size 12m;   # multi-image uploads (limit per file is enforced by the API)

    location /api/ {
        proxy_pass http://portfolio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/ab-portfolio/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /var/www/ab-portfolio/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://portfolio_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
